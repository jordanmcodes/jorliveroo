{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saver Menu</title>
</head>
<body>
        <!--This page displays all of the items for the Saver menu category-->

    <h1> Saver Menu</h1>
     <div class="menu-style">
        {% if chosen_item %}
        <p>Item added: {{ chosen_item}}</p>
        {% endif %}
    {% for item in items %}
    <div>
    <p> {{ item.name }} - £{{ item.price }} </p>
       
         <form method="POST" action="{% url 'saver_menu' %}">
            {% csrf_token %}
            <input type="hidden" name="item_id" value="{{ item.id }}">
            <input type="submit" value="Add">
        </form>
        </div>
        {% endfor %}
        </div>

    <a href="{% url 'menu' %}" class= "backtomenubutton">
            Main Menu
            </a>

    <a href="{% url 'basket' %}" class= "backtomenubutton">
            Basket
            </a>
</body>
</html>
